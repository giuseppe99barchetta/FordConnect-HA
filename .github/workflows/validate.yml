name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python, JSON, and syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install --upgrade pip ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate JSON
        run: >-
          python -c "import json; from pathlib import Path;
          [json.loads(path.read_text(encoding='utf-8')) for path in Path('.').rglob('*.json')];
          print('All JSON files are valid.')"
      - name: Compile integration
        run: python -m compileall -q custom_components

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
