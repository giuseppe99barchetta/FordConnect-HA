name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag and manifest version
        run: python .github/scripts/check_release_version.py "${GITHUB_REF_NAME}"
      - name: Install test tools
        run: python -m pip install --upgrade pip ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate JSON
        run: >-
          python -c "import json; from pathlib import Path;
          [json.loads(path.read_text(encoding='utf-8')) for path in Path('.').rglob('*.json')];
          print('All JSON files are valid.')"
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration
      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@master
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
